name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    name: Lint & Test (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx
          pip install -r requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Test Suite
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-32-characters-long-carecircle
          GEMINI_API_KEY: mock
          CLOUD_SCHEDULER_SECRET: carecircle-internal-scheduler-secret-2026
        run: |
          pytest -v
